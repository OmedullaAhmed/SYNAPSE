# Copy to .streamlit/secrets.toml (never commit it). On Streamlit Community Cloud paste it into the app's Settings -> Secrets.

# PostgreSQL keeps plans, line decisions, released transfers, dispatch/receipt events, users and the audit trail
# across restarts. Free options: Neon (neon.tech) or Supabase. Without it the app uses a local SQLite file,
# which Streamlit Community Cloud wipes on every restart.
# Demo without sign-in (fictional demo brand only). Set to false once a brand's real data is in the app.
guest_demo = true

[database]
url = "postgresql://USER:PASSWORD@HOST/DBNAME?sslmode=require"

# Users. Optional: with none here, the first visitor creates the admin account and adds others in the Admin tab
# (stored hashed in the database). Users listed here always win and can't be edited in the app.
# Hash a password with:  python auth.py
[users.planner]
password = "pbkdf2$200000$<salt>$<hash>"
role = "admin"
stores = ""

[users.am_north]
password = "pbkdf2$200000$<salt>$<hash>"
role = "approver"
stores = "JAI-01, JAI-02, UDR-01"

# ANTHROPIC_API_KEY = "..."   # only if AI answers are allowed

# Optional: send WhatsApp alerts automatically when trips are released and when stock leaves or arrives short.
# Without this section the app shows one-tap "Send on WhatsApp" buttons instead.
[whatsapp]
provider = "meta"                  # Meta WhatsApp Cloud API ("twilio" also works: account_sid, auth_token, from, content_sid)
token = "EAAG..."
phone_number_id = "1234567890"
template = "stockflow_approved"    # approved utility template, body variables {{1}} = name, {{2}} = summary
language = "en"
# replies from managers (agents turn them into proposed transfer updates; nothing is recorded until approved)
verify_token = "choose-a-long-random-string"   # Meta webhook verification
app_secret = "..."                            # Meta app secret: checks X-Hub-Signature-256
# auth_token = "..."                          # Twilio: checks X-Twilio-Signature
# inbound_url = "https://stock.example.com/api/v1/whatsapp/inbound"

# ---------------------------------------------------------------- company sign-in (SSO, optional)
# Microsoft Entra ID / Google Workspace / Okta through OpenID Connect. Users still need a StockFlow user (user name = work
# email) for their role; MFA is whatever the company's identity provider enforces.
# [auth]
# redirect_uri = "https://your-app.streamlit.app/oauth2callback"
# cookie_secret = "a long random string"
# client_id = "…"
# client_secret = "…"
# server_metadata_url = "https://login.microsoftonline.com/<tenant-id>/v2.0/.well-known/openid-configuration"

