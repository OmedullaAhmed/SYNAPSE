# Builds the StockFlow Android app (debug APK for testing) on GitHub's machines: on every change to the phone app,
# or by hand (Actions -> Build Android app -> Run workflow). The APK appears under the run's Artifacts.
# A signed release (Play Store) needs your keystore as repository secrets; see mobile/README.md.
name: Build Android app
on:
  push:
    branches: [main]
    paths: ["mobile/**", ".github/workflows/mobile-build.yml"]
  workflow_dispatch: {}
permissions: {contents: read}
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - run: npm run build && npx cap sync android
      - run: cd android && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: stockflow-android-debug
          path: mobile/android/app/build/outputs/apk/debug/*.apk
