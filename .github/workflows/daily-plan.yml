# Builds tomorrow's StockFlow plan every morning and saves it to the database for approval.
# Repository secrets needed: DATABASE_URL, and the source of the day's files, for example
#   STOCKFLOW_AUTOMATION_SOURCE=sftp, STOCKFLOW_AUTOMATION_HOST, STOCKFLOW_AUTOMATION_USERNAME, STOCKFLOW_AUTOMATION_PASSWORD,
#   STOCKFLOW_AUTOMATION_REMOTE_DIR    (or SOURCE=url with STOCKFLOW_AUTOMATION_URLS='["https://…"]' and STOCKFLOW_AUTOMATION_TOKEN)
# Optional ERP pick-up: STOCKFLOW_ERP_CHANNEL, STOCKFLOW_ERP_EVENTS_URL, STOCKFLOW_ERP_TOKEN
name: Daily stock plan
# PAUSED: the schedule is switched off. Runs only when started by hand (Actions -> Daily stock plan -> Run workflow).
# To resume every morning at 06:30 IST, put back:
#   schedule:
#     - cron: "0 1 * * *"
on:
  workflow_dispatch: {}
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: stock_mover
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: stock_mover/requirements.txt
      - run: pip install -r requirements.txt
      - run: python daily.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          STOCKFLOW_AUTOMATION_SOURCE: ${{ secrets.STOCKFLOW_AUTOMATION_SOURCE }}
          STOCKFLOW_AUTOMATION_HOST: ${{ secrets.STOCKFLOW_AUTOMATION_HOST }}
          STOCKFLOW_AUTOMATION_USERNAME: ${{ secrets.STOCKFLOW_AUTOMATION_USERNAME }}
          STOCKFLOW_AUTOMATION_PASSWORD: ${{ secrets.STOCKFLOW_AUTOMATION_PASSWORD }}
          STOCKFLOW_AUTOMATION_REMOTE_DIR: ${{ secrets.STOCKFLOW_AUTOMATION_REMOTE_DIR }}
          STOCKFLOW_AUTOMATION_URLS: ${{ secrets.STOCKFLOW_AUTOMATION_URLS }}
          STOCKFLOW_AUTOMATION_TOKEN: ${{ secrets.STOCKFLOW_AUTOMATION_TOKEN }}
          STOCKFLOW_ERP_CHANNEL: ${{ secrets.STOCKFLOW_ERP_CHANNEL }}
          STOCKFLOW_ERP_EVENTS_URL: ${{ secrets.STOCKFLOW_ERP_EVENTS_URL }}
          STOCKFLOW_ERP_TOKEN: ${{ secrets.STOCKFLOW_ERP_TOKEN }}
