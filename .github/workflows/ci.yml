# Every push and pull request: all check suites on SQLite and on PostgreSQL, plus code and dependency security scans.
name: Tests
on:
  push: {branches: [main]}
  pull_request: {}
  workflow_dispatch: {}
permissions: {contents: read}
concurrency: {group: "tests-${{ github.ref }}", cancel-in-progress: true}
jobs:
  suites:
    name: Check suites (${{ matrix.db }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: {db: [sqlite, postgres]}
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_PASSWORD: ci}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: stock_mover/requirements.txt}
      - run: sudo apt-get update -q && sudo apt-get install -y -q tesseract-ocr tesseract-ocr-eng
      - run: pip install -r stock_mover/requirements.txt httpx
      - name: Run every suite
        working-directory: stock_mover
        env:
          PG_BASE: ${{ matrix.db == 'postgres' && 'postgresql://postgres:ci@localhost:5432' || '' }}
        run: python tests/run_all.py

  security:
    name: Security scans (code and dependencies)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install bandit pip-audit
      - name: Bandit (no high-severity findings allowed)
        run: bandit -q -r stock_mover -lll -x stock_mover/tests
      - name: pip-audit (known vulnerabilities in Python packages)
        run: pip-audit -r stock_mover/requirements.txt --progress-spinner off
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - name: npm audit (phone app, high or critical)
        working-directory: mobile
        run: npm ci --no-audit --no-fund && npm audit --omit=dev --audit-level=high
